# GLM-5.3 in Claude Code, set up as in the settings table of the README.
#
#   export ANTHROPIC_API_KEY=...                     the endpoint's key
#   export ANTHROPIC_BASE_URL=https://<endpoint>     an endpoint serving GLM-5.3 through the Anthropic Messages API
#   harbor run -c configs/glm-5.3.yaml -p REE/tasks/<task> --allow-agent-host <endpoint host>
#
# Run it from the repository root: prompt_template_path is relative to the current directory.
n_concurrent_trials: 1
agent_setup_timeout_multiplier: 10
agents:
  - name: claude-code
    model_name: "glm-5.3"
    kwargs:
      version: "2.1.309"
      reasoning_effort: max
      disallowed_tools: "WebSearch,WebFetch"
      prompt_template_path: "prompts/ree-12h.j2"
      # Claude Code assumes a 200K window for a model it does not know; our runs gave it 500,000.
      # It goes in Claude Code's settings rather than in env below: Harbor treats the value of an env
      # variable whose name holds TOKEN as a secret and replaces that number in every trial file.
      config:
        env:
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "500000"
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL}"
      API_TIMEOUT_MS: "900000"
      CLAUDE_CODE_MAX_RETRIES: "60"
      CLAUDE_CODE_RETRY_WATCHDOG: "1"
      ANTHROPIC_DEFAULT_FABLE_MODEL: "glm-5.3"
      ANTHROPIC_SMALL_FAST_MODEL: "glm-5.3"
